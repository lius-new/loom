name: Prepare Loom build dependencies
description: Verified private CMake and target-specific Skia, shared with local builds
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: '24'
        package-manager-cache: false
    - uses: actions/cache@v6
      with:
        path: .packaging/dependencies
        key: dependencies-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/dependencies/manifest.json', 'scripts/dependencies/*.mjs', 'Cargo.lock') }}
    - name: Prepare verified CMake and host Skia
      shell: bash
      run: node scripts/dependencies/ensure.mjs --github
    - name: Check dependency regressions on this OS
      shell: bash
      run: node --test scripts/dependencies/dependencies.test.mjs
    - name: Verify private tools and exported environment
      shell: bash
      run: node scripts/dependencies/smoke.mjs
