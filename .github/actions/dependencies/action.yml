name: Prepare Loom build dependencies
description: Verified private CMake and target-specific Skia, shared with local builds
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: "24"
        package-manager-cache: false
    - uses: ./.github/actions/cargo-cache
    - uses: actions/cache@v6
      with:
        path: |-
          .packaging/dependencies
          .packaging/downloads
        key: build-inputs-${{ runner.os }}-${{ runner.arch }}-${{ inputs.variant }}-${{ hashFiles('scripts/dependencies/manifest.json', 'scripts/package/windows/index.mjs', 'scripts/package/linux/index.mjs', 'scripts/package/macos/index.mjs', 'Cargo.lock') }}
        restore-keys: |-
          build-inputs-${{ runner.os }}-${{ runner.arch }}-${{ inputs.variant }}-
          build-inputs-${{ runner.os }}-${{ runner.arch }}-
    - name: Prepare verified CMake and host Skia
      if: inputs.prepare == 'true'
      shell: bash
      run: node scripts/dependencies/ensure.mjs --github
inputs:
  prepare:
    description: Prepare now; release compile prepares each target itself
    default: "true"
  variant:
    description: Separate native and universal release archive caches
    default: native
