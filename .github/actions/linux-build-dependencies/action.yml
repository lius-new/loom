name: Install Linux host build dependencies
description: Native compiler, font and graphics libraries used by Loom CI
runs:
  using: composite
  steps:
    - name: Install Linux build dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes \
          build-essential dpkg-dev \
          libfreetype-dev \
          libfontconfig-dev \
          libegl1-mesa-dev \
          libgl1-mesa-dev \
          libgles2-mesa-dev \
          libwayland-dev \
          libxkbcommon-dev fonts-noto-cjk fonts-noto-color-emoji
