name: Prepare release draft

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Existing application tag version, without the leading v
        required: true
        default: "0.1.5"

permissions:
  contents: read

concurrency:
  group: release-draft-${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

jobs:
  draft:
    name: Create GitHub release draft
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out release source and history
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.ref }}
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Resolve release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Generate notes and prepare draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: >-
          node scripts/release/publish.mjs --create
          --version "$VERSION" --target HEAD --repo "$GITHUB_REPOSITORY"
          --notes "$RUNNER_TEMP/loom-release-notes.md"
