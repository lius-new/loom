name: Release (macOS)

# Packages are ad-hoc signed unless these repository secrets are set:
#   MACOS_CERTIFICATE_P12       base64 of a Developer ID Application .p12
#   MACOS_CERTIFICATE_PASSWORD  password of that .p12
#   MACOS_SIGN_IDENTITY         e.g. "Developer ID Application: Name (TEAMID)"
# and, to notarize as well:
#   MACOS_NOTARY_APPLE_ID, MACOS_NOTARY_TEAM_ID, MACOS_NOTARY_PASSWORD
#   (an app-specific password of that Apple ID)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version from Cargo.toml, without the leading v
        required: true
        default: "0.1.1"
      publish:
        description: Upload the packages to the GitHub release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  LOOM_LANGUAGE_PACKS: .packaging/language-artifacts
  LOOM_LANGUAGE_PACKS_URL: ${{ vars.LOOM_LANGUAGE_PACKS_MACOS_UNIVERSAL_URL }}
  LOOM_LANGUAGE_PACKS_SHA256: ${{ vars.LOOM_LANGUAGE_PACKS_MACOS_UNIVERSAL_SHA256 }}

jobs:
  package:
    name: Package macOS universal
    runs-on: macos-15
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      LOOM_MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      LOOM_MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      LOOM_MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
      LOOM_MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Resolve release version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Prepare build dependencies
        uses: ./.github/actions/dependencies

      - name: Show Node.js version
        run: node --version

      # A temporary keychain that only this job uses; removed at the end.
      - name: Import signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "$CERTIFICATE_P12" ]]; then
            echo "::notice::No Developer ID certificate configured; packages are ad-hoc signed."
            exit 0
          fi
          keychain="$RUNNER_TEMP/loom-signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/loom-signing.p12"
          security import "$RUNNER_TEMP/loom-signing.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/loom-signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

      # The packaging scripts verify Cargo.toml against the requested version
      # before doing any work.
      - name: Install packaging toolchain
        run: node scripts/package/package.mjs setup --platform macos --expect-version ${{ steps.version.outputs.version }}

      - name: Run tests
        run: cargo test --locked --workspace

      - name: Test upstream WASM modules without native language binaries
        run: node tests/language-runtime/run-wasm.mjs

      - name: Fetch prebuilt standard language resources
        run: node scripts/package/fetch-languages.mjs

      - name: Test prebuilt language runtime
        run: node tests/language-runtime/run.mjs --packages .packaging/language-artifacts

      - name: Compile
        run: node scripts/package/package.mjs compile --platform macos --expect-version ${{ steps.version.outputs.version }}

      - name: Package
        run: node scripts/package/package.mjs package --platform macos --expect-version ${{ steps.version.outputs.version }}

      - name: Build .dmg
        run: node scripts/package/package.mjs bundle --platform macos --expect-version ${{ steps.version.outputs.version }}

      - name: Check the .dmg
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dmg=".packaging/dist/Loom-$VERSION-macos-universal.dmg"
          hdiutil verify "$dmg"
          mount="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
          codesign --verify --deep --strict "$mount/Loom.app"
          test "$(readlink "$mount/Applications")" = /Applications
          hdiutil detach "$mount"

      # Loom checks releases/latest/download/update-macos-universal.json.
      - name: Write update manifest
        env:
          LOOM_UPDATE_SIGNING_KEY: ${{ secrets.LOOM_UPDATE_SIGNING_KEY }}
        run: node scripts/package/package.mjs manifest --expect-version ${{ steps.version.outputs.version }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Loom-${{ steps.version.outputs.version }}-macos-universal
          path: |
            .packaging/dist/Loom-${{ steps.version.outputs.version }}-macos-universal*
            .packaging/dist/update-macos-universal.json
          if-no-files-found: error

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/loom-signing.keychain-db" 2>/dev/null || true

  publish:
    name: Publish to GitHub release
    needs: package
    # Tag pushes always publish; manual runs only when asked to.
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          name: Loom-${{ needs.package.outputs.version }}-macos-universal
          path: dist

      # Each platform workflow adds its own assets to the shared release. The
      # other platforms run on the same tag, so creation can race: fall back
      # to uploading when the release appeared in the meantime.
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.package.outputs.version }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            ! gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Loom $VERSION" \
              --generate-notes; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          fi
