name: Additional validation
on:
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false
      tooling:
        type: boolean
        default: false
      evidence:
        type: boolean
        default: false
      wasm:
        type: boolean
        default: false
      standalone:
        type: boolean
        default: false
      package:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      full:
        description: Run every additional validation
        type: boolean
        default: true
      tooling:
        description: Run tooling validation
        type: boolean
        default: false
      evidence:
        description: Run evidence validation
        type: boolean
        default: false
      wasm:
        description: Run wasm validation
        type: boolean
        default: false
      standalone:
        description: Run standalone validation
        type: boolean
        default: false
      package:
        description: Run package validation
        type: boolean
        default: false
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  matrix:
    name: Validate ${{ matrix.label }}
    if: inputs.full || inputs.tooling || inputs.evidence || inputs.wasm || inputs.package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            os: ubuntu-24.04
            target_name: linux-x86_64
            extension: tar.gz
          - label: Windows x64
            os: windows-2025
            target_name: windows-x86_64
            extension: zip
          - label: macOS universal
            os: macos-15
            target_name: macos-universal
            extension: zip
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Prepare native validation dependencies
        if: inputs.full || inputs.tooling || inputs.evidence || inputs.package
        uses: ./.github/actions/dependencies
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
        if: "!(inputs.full || inputs.tooling || inputs.evidence || inputs.package)"
      - name: Run development-tool self-tests
        if: inputs.full || inputs.tooling
        run: |-
          npm ci --ignore-scripts --prefix scripts/ci
          npm ci --ignore-scripts --prefix scripts/language-packs
          node scripts/ci/test-tools.mjs
          node scripts/language-packs/check.mjs --all
          node scripts/lsp-servers/check.mjs
          node scripts/dependencies/smoke.mjs
      - name: Install Linux native libraries
        if: runner.os == 'Linux' && (inputs.full || inputs.evidence || inputs.package)
        uses: ./.github/actions/linux-build-dependencies
      - name: Record production Markdown evidence
        if: inputs.full || inputs.evidence
        env:
          LOOM_MARKDOWN_EVIDENCE_DIR: markdown-evidence
        run: cargo test --locked -p loom app::markdown_tests::production_markdown_evidence -- --ignored --exact --nocapture
      - name: Upload Markdown evidence
        if: inputs.full || inputs.evidence
        uses: actions/upload-artifact@v7
        with:
          name: Markdown-evidence-${{ matrix.target_name }}
          path: markdown-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Verify installed WASM runtime
        if: inputs.full || inputs.wasm
        run: node tests/language-runtime/run-wasm.mjs
      - name: Read preview package version
        if: inputs.full || inputs.package
        run: node scripts/release/version.mjs --read-env
      - name: Build release binary
        if: (inputs.full || inputs.package) && (runner.os != 'macOS')
        run: cargo build --locked --release
      - name: Build macOS universal host
        if: (inputs.full || inputs.package) && (runner.os == 'macOS')
        shell: bash
        run: |
          node scripts/package/package.mjs setup --platform macos --expect-version "$LOOM_VERSION"
          node scripts/package/package.mjs compile --platform macos --expect-version "$LOOM_VERSION"
      - name: Package Linux binary
        if: (inputs.full || inputs.package) && (runner.os == 'Linux')
        shell: bash
        run: |
          node scripts/package/package.mjs package --platform linux --expect-version "$LOOM_VERSION"
          mkdir -p dist
          cp ".packaging/dist/Loom-$LOOM_VERSION-linux-x86_64.tar.gz" dist/
      - name: Package macOS app
        if: (inputs.full || inputs.package) && (runner.os == 'macOS')
        shell: bash
        run: |
          node scripts/package/package.mjs package --platform macos --expect-version "$LOOM_VERSION"
          mkdir -p dist
          cp ".packaging/dist/Loom-$LOOM_VERSION-macos-universal.zip" dist/
      - name: Package Windows binary
        if: (inputs.full || inputs.package) && (runner.os == 'Windows')
        shell: pwsh
        env:
          PACKAGE: Loom-${{ env.LOOM_VERSION }}-${{ matrix.target_name }}
          ARCHIVE: Loom-${{ env.LOOM_VERSION }}-${{ matrix.target_name }}.${{ matrix.extension }}
        run: |
          $packageDir = Join-Path dist $env:PACKAGE
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          Copy-Item target/release/Loom.exe, README.md, LICENSE-MIT, LICENSE-APACHE, THIRD_PARTY_NOTICES.md $packageDir
          node scripts/package/stage-languages.mjs (Join-Path $packageDir 'language-packs')
          $gitExe = (Get-Command git).Source
          $gitRoot = Split-Path (Split-Path $gitExe -Parent) -Parent
          $gitVersion = (& $gitExe --version).Split(' ')[2]
          & scripts/package-git-runtime.ps1 -SourceRoot $gitRoot -PackageRoot $packageDir -Version $gitVersion -SourceUrl "system-package:Windows"
          $runtimeGit = Join-Path $packageDir 'runtime/git/bin/git.exe'
          if (-not (Test-Path $runtimeGit)) { $runtimeGit = Join-Path $packageDir 'runtime/git/cmd/git.exe' }
          $smoke = Join-Path $env:RUNNER_TEMP 'loom-git-smoke'
          New-Item -ItemType Directory -Path $smoke -Force | Out-Null
          & $runtimeGit -C $smoke init
          & $runtimeGit -C $smoke status --porcelain=v2
          Compress-Archive -Path $packageDir -DestinationPath (Join-Path dist $env:ARCHIVE)
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Loom-${{ env.LOOM_VERSION }}-${{ matrix.target_name }}
          path: dist/Loom-${{ env.LOOM_VERSION }}-${{ matrix.target_name }}.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 14
        if: (inputs.full || inputs.package)
  standalone:
    name: Host without language sources
    if: inputs.full || inputs.standalone
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-build-dependencies
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Prepare build dependencies
        uses: ./.github/actions/dependencies
      - name: Verify source independence
        run: node scripts/architecture/standalone-host.mjs
