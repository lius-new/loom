name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  LOOM_VERSION: 0.1.0

jobs:
  quality:
    name: Format and lint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libfreetype-dev \
            libfontconfig-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libwayland-dev \
            libxkbcommon-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: >-
          cargo clippy --locked --all-targets --
          -D warnings
          -A clippy::redundant_closure_call
          -A clippy::collapsible_if
          -A clippy::too_many_arguments
          -A clippy::let_and_return
          -A clippy::manual_div_ceil

  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            os: ubuntu-24.04
            target_name: linux-x86_64
            extension: tar.gz
          - label: Windows x64
            os: windows-2025
            target_name: windows-x86_64
            extension: zip
          - label: macOS ARM64
            os: macos-15
            target_name: macos-aarch64
            extension: tar.gz

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libfreetype-dev \
            libfontconfig-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libwayland-dev \
            libxkbcommon-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --locked --release

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        env:
          PACKAGE: Loom-${{ env.LOOM_VERSION }}-${{ matrix.target_name }}
          ARCHIVE: Loom-${{ env.LOOM_VERSION }}-${{ matrix.target_name }}.${{ matrix.extension }}
        run: |
          mkdir -p "dist/$PACKAGE"
          cp target/release/Loom README.md LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md "dist/$PACKAGE/"
          chmod +x "dist/$PACKAGE/Loom"
          bash scripts/stage-system-git-runtime.sh "dist/$PACKAGE"
          runtime="$PWD/dist/$PACKAGE/runtime/git"
          smoke="$RUNNER_TEMP/loom-git-smoke"
          rm -rf "$smoke"
          mkdir -p "$smoke"
          GIT_EXEC_PATH="$runtime/libexec/git-core" GIT_TEMPLATE_DIR="$runtime/share/git-core/templates" \
            "$runtime/bin/git" -C "$smoke" init
          GIT_EXEC_PATH="$runtime/libexec/git-core" "$runtime/bin/git" -C "$smoke" status --porcelain=v2
          tar -czf "dist/$ARCHIVE" -C dist "$PACKAGE"

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PACKAGE: Loom-${{ env.LOOM_VERSION }}-${{ matrix.target_name }}
          ARCHIVE: Loom-${{ env.LOOM_VERSION }}-${{ matrix.target_name }}.${{ matrix.extension }}
        run: |
          $packageDir = Join-Path dist $env:PACKAGE
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          Copy-Item target/release/Loom.exe, README.md, LICENSE-MIT, LICENSE-APACHE, THIRD_PARTY_NOTICES.md $packageDir
          $gitExe = (Get-Command git).Source
          $gitRoot = Split-Path (Split-Path $gitExe -Parent) -Parent
          $gitVersion = (& $gitExe --version).Split(' ')[2]
          & scripts/package-git-runtime.ps1 -SourceRoot $gitRoot -PackageRoot $packageDir -Version $gitVersion -SourceUrl "system-package:Windows"
          $runtimeGit = Join-Path $packageDir 'runtime/git/bin/git.exe'
          if (-not (Test-Path $runtimeGit)) { $runtimeGit = Join-Path $packageDir 'runtime/git/cmd/git.exe' }
          $smoke = Join-Path $env:RUNNER_TEMP 'loom-git-smoke'
          New-Item -ItemType Directory -Path $smoke -Force | Out-Null
          & $runtimeGit -C $smoke init
          & $runtimeGit -C $smoke status --porcelain=v2
          Compress-Archive -Path $packageDir -DestinationPath (Join-Path dist $env:ARCHIVE)

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Loom-${{ env.LOOM_VERSION }}-${{ matrix.target_name }}
          path: dist/Loom-${{ env.LOOM_VERSION }}-${{ matrix.target_name }}.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 14
