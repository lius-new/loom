name: CI
on:
  push:
    branches:
      - main
  pull_request: null
  workflow_dispatch:
    inputs:
      full:
        description: Run packaging and every deep integration check
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  changes:
    name: Select validation scope
    runs-on: ubuntu-24.04
    outputs:
      tooling: ${{ steps.scope.outputs.tooling }}
      evidence: ${{ steps.scope.outputs.evidence }}
      wasm: ${{ steps.scope.outputs.wasm }}
      standalone: ${{ steps.scope.outputs.standalone }}
      package: ${{ steps.scope.outputs.package }}
      validation: ${{ steps.scope.outputs.validation }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Select expensive checks from event and changed paths
        id: scope
        run: node scripts/ci/plan.mjs
  static:
    name: Format and architecture
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Check formatting and architecture
        run: |-
          cargo fmt --all -- --check
          node scripts/architecture/check.mjs
  core:
    name: Independent editor and workspace rules
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: ./.github/actions/cargo-cache
      - name: Test core without GUI build dependencies
        run: cargo test --locked -p loom-editor-core
      - name: Test workspace domain without GUI build dependencies
        run: cargo test --locked -p loom-workspace-tests
      - name: Test production Markdown rules without GUI build dependencies
        run: cargo test --locked -p loom-markdown-tests
  build:
    name: Test ${{ matrix.label }}
    needs: changes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            os: ubuntu-24.04
            target_name: linux-x86_64
            extension: tar.gz
          - label: Windows x64
            os: windows-2025
            target_name: windows-x86_64
            extension: zip
          - label: macOS host
            os: macos-15
            target_name: macos-universal
            extension: zip
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-build-dependencies
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: ${{ runner.os == 'Linux' && 'clippy' || '' }}
      - name: Prepare build dependencies
        uses: ./.github/actions/dependencies
      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings -A clippy::redundant_closure_call -A clippy::collapsible_if -A clippy::too_many_arguments -A clippy::let_and_return -A clippy::manual_div_ceil
        if: runner.os == 'Linux'
      - name: Run tests
        run: cargo test --locked -p loom
  result:
    name: CI result
    if: ${{ always() }}
    needs:
      - changes
      - static
      - core
      - build
      - validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Require all mandatory and selected checks
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/result.mjs
  validation:
    name: Additional validation
    needs: changes
    if: needs.changes.outputs.validation == 'true'
    uses: ./.github/workflows/validation.yml
    with:
      tooling: ${{ fromJSON(needs.changes.outputs.tooling) }}
      evidence: ${{ fromJSON(needs.changes.outputs.evidence) }}
      wasm: ${{ fromJSON(needs.changes.outputs.wasm) }}
      standalone: ${{ fromJSON(needs.changes.outputs.standalone) }}
      package: ${{ fromJSON(needs.changes.outputs.package) }}
