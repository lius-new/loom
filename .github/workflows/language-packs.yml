name: Language packages

on:
  workflow_dispatch:
    inputs:
      packages:
        description: Comma-separated package ids, or all
        default: all
        required: true
      release:
        description: Fixed resource tag (language-packs-*)
        default: language-packs-001
        required: true
      publish:
        description: Publish the verified resource release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: language-packs-${{ inputs.release }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - run: npm ci --ignore-scripts --prefix scripts/language-packs
      - run: node --test scripts/language-packs/pipeline.test.mjs
      - name: Build selected packages
        env:
          PACKAGES: ${{ inputs.packages }}
        run: |
          if [ "$PACKAGES" = all ]; then
            node scripts/language-packs/build.mjs --all
          else
            node scripts/language-packs/build.mjs --packages "$PACKAGES"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: language-package-artifacts
          path: |
            .packaging/language-packs/dist
            .packaging/language-packs/stage
          if-no-files-found: error
          include-hidden-files: true

  validate:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - run: npm ci --ignore-scripts --prefix scripts/language-packs
      - uses: actions/download-artifact@v4
        with:
          name: language-package-artifacts
          path: .packaging/language-packs
      - run: node scripts/language-packs/validate.mjs

  publish:
    if: inputs.publish
    needs: [build, validate]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --prefix scripts/language-packs
      - uses: actions/download-artifact@v4
        with:
          name: language-package-artifacts
          path: .packaging/language-packs
      - name: Prepare and verify publication
        env:
          RESOURCE_TAG: ${{ inputs.release }}
          RESOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/language-packs/publish.mjs prepare --release "$RESOURCE_TAG" --repository "$RESOURCE_REPOSITORY"
          node scripts/language-packs/publish.mjs verify
      - name: Publish and promote the application manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/language-packs/publish.mjs publish
      - uses: actions/upload-artifact@v4
        with:
          name: released-language-package-catalog
          path: assets/language-packs/language-packs.toml
          if-no-files-found: error
      - name: Record the next maintenance step
        run: echo 'Commit the released-language-package-catalog artifact before shipping Loom with this resource batch.' >> "$GITHUB_STEP_SUMMARY"
