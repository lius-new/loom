name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version from Cargo.toml, without the leading v
        required: true
        default: "0.1.0"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  resolve:
    name: Validate version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Resolve release version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi

          cargo_version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          if [[ "$version" != "$cargo_version" ]]; then
            echo "Requested version $version does not match Cargo.toml version $cargo_version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.label }}
    needs: resolve
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            os: ubuntu-24.04
            target_name: linux-x86_64
            extension: tar.gz
          - label: Windows x64
            os: windows-2025
            target_name: windows-x86_64
            extension: zip
          - label: macOS ARM64
            os: macos-15
            target_name: macos-aarch64
            extension: tar.gz

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libfreetype-dev \
            libfontconfig-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libwayland-dev \
            libxkbcommon-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --locked --release

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          TARGET_NAME: ${{ matrix.target_name }}
        run: |
          package="Loom-$VERSION-$TARGET_NAME"
          mkdir -p "dist/$package"
          cp target/release/Loom README.md LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md "dist/$package/"
          chmod +x "dist/$package/Loom"
          bash scripts/stage-system-git-runtime.sh "dist/$package"
          runtime="$PWD/dist/$package/runtime/git"
          smoke="$RUNNER_TEMP/loom-git-smoke"
          rm -rf "$smoke"
          mkdir -p "$smoke"
          GIT_EXEC_PATH="$runtime/libexec/git-core" GIT_TEMPLATE_DIR="$runtime/share/git-core/templates" \
            "$runtime/bin/git" -C "$smoke" init
          GIT_EXEC_PATH="$runtime/libexec/git-core" "$runtime/bin/git" -C "$smoke" status --porcelain=v2
          tar -czf "dist/$package.tar.gz" -C dist "$package"

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          TARGET_NAME: ${{ matrix.target_name }}
        run: |
          $package = "Loom-$env:VERSION-$env:TARGET_NAME"
          $packageDir = Join-Path dist $package
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          Copy-Item target/release/Loom.exe, README.md, LICENSE-MIT, LICENSE-APACHE, THIRD_PARTY_NOTICES.md $packageDir
          $gitExe = (Get-Command git).Source
          $gitRoot = Split-Path (Split-Path $gitExe -Parent) -Parent
          $gitVersion = (& $gitExe --version).Split(' ')[2]
          & scripts/package-git-runtime.ps1 -SourceRoot $gitRoot -PackageRoot $packageDir -Version $gitVersion -SourceUrl "system-package:Windows"
          $runtimeGit = Join-Path $packageDir 'runtime/git/bin/git.exe'
          if (-not (Test-Path $runtimeGit)) { $runtimeGit = Join-Path $packageDir 'runtime/git/cmd/git.exe' }
          $smoke = Join-Path $env:RUNNER_TEMP 'loom-git-smoke'
          New-Item -ItemType Directory -Path $smoke -Force | Out-Null
          & $runtimeGit -C $smoke init
          & $runtimeGit -C $smoke status --porcelain=v2
          Compress-Archive -Path $packageDir -DestinationPath "dist/$package.zip"

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: Loom-${{ needs.resolve.outputs.version }}-${{ matrix.target_name }}
          path: dist/Loom-${{ needs.resolve.outputs.version }}-${{ matrix.target_name }}.${{ matrix.extension }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs:
      - resolve
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: Loom-${{ needs.resolve.outputs.version }}-*
          path: dist
          merge-multiple: true

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Loom $VERSION" \
              --generate-notes
          fi
