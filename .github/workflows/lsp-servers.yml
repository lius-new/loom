name: Language servers

on:
  workflow_dispatch:
    inputs:
      packs:
        description: Comma-separated pack ids, or all
        default: all
        required: true
      release:
        description: Fixed resource tag (lsp-servers-*)
        default: lsp-servers-001
        required: true
      publish:
        description: Publish the verified resource release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: lsp-servers-${{ inputs.release }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: false
      - run: npm ci --ignore-scripts --prefix scripts/language-packs
      - name: Check recipes, pins and lockfiles
        run: |
          node scripts/lsp-servers/check.mjs
          node --test scripts/lsp-servers/pipeline.test.mjs scripts/lsp-servers/catalog-sync.test.mjs
      - name: Build selected packs
        env:
          PACKS: ${{ inputs.packs }}
        run: |
          if [ "$PACKS" = all ]; then
            node scripts/lsp-servers/build.mjs --all
          else
            node scripts/lsp-servers/build.mjs --packs "$PACKS"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: language-server-artifacts
          path: .packaging/lsp-servers/dist
          if-no-files-found: error
          include-hidden-files: true

  validate:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --prefix scripts/language-packs
      - uses: actions/download-artifact@v4
        with:
          name: language-server-artifacts
          path: .packaging/lsp-servers/dist
      - name: Start every server of this platform and complete an LSP handshake
        run: node scripts/lsp-servers/validate.mjs

  publish:
    if: inputs.publish
    needs: [build, validate]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Require a branch for catalog synchronization
        if: github.ref_type != 'branch'
        run: |
          echo '::error::Run publication from a branch so the released catalog can be committed back to it.'
          exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --prefix scripts/language-packs
      - uses: actions/download-artifact@v4
        with:
          name: language-server-artifacts
          path: .packaging/lsp-servers/dist
      - name: Prepare and verify publication
        env:
          RESOURCE_TAG: ${{ inputs.release }}
          RESOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/lsp-servers/publish.mjs prepare --release "$RESOURCE_TAG" --repository "$RESOURCE_REPOSITORY"
          node scripts/lsp-servers/publish.mjs verify
      - name: Publish and promote the application manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/lsp-servers/publish.mjs publish
      - uses: actions/upload-artifact@v4
        with:
          name: released-language-server-catalog
          path: assets/lsp-servers/lsp-servers.toml
          if-no-files-found: error
      - name: Commit and push the released catalog
        env:
          CATALOG_BRANCH: ${{ github.ref_name }}
          RESOURCE_TAG: ${{ inputs.release }}
        run: |
          catalog=assets/lsp-servers/lsp-servers.toml
          git add -- "$catalog"
          if git diff --cached --quiet; then
            echo 'The released catalog is already committed.' >> "$GITHUB_STEP_SUMMARY"
          else
            producer_commit=$(git rev-parse HEAD)
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "chore: sync language server catalog for $RESOURCE_TAG" -m "Release Notes:" -m "- Changed the bundled language server catalog."
            git fetch origin "refs/heads/$CATALOG_BRANCH"
            git merge-base --is-ancestor "$producer_commit" FETCH_HEAD
            git rebase FETCH_HEAD
            git push origin "HEAD:refs/heads/$CATALOG_BRANCH"
            echo "Committed and pushed the released catalog to $CATALOG_BRANCH." >> "$GITHUB_STEP_SUMMARY"
          fi
