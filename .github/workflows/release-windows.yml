name: Release (Windows)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version from Cargo.toml, without the leading v
        required: true
        default: "0.1.4"

permissions:
  contents: read

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Package Windows x64
    runs-on: windows-2025
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Resolve release version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Prepare build dependencies
        uses: ./.github/actions/dependencies

      - name: Show Node.js version
        run: node --version

      # The packaging scripts verify Cargo.toml against the requested version
      # before doing any work.
      - name: Install packaging toolchain
        run: node scripts/package/package.mjs setup --expect-version ${{ steps.version.outputs.version }}

      - name: Check installer relaunch and junction access
        run: node scripts/package/windows/launch-smoke.mjs

      - name: Run tests
        run: cargo test --locked --workspace

      - name: Test upstream WASM modules without native language binaries
        run: node tests/language-runtime/run-wasm.mjs

      - name: Compile
        run: node scripts/package/package.mjs compile --expect-version ${{ steps.version.outputs.version }}

      - name: Package
        run: node scripts/package/package.mjs package --expect-version ${{ steps.version.outputs.version }}

      - name: Build installer
        run: node scripts/package/package.mjs bundle --expect-version ${{ steps.version.outputs.version }}

      # Loom checks releases/latest/download/update-windows-x86_64.json.
      - name: Write update manifest
        env:
          LOOM_UPDATE_SIGNING_KEY: ${{ secrets.LOOM_UPDATE_SIGNING_KEY }}
        run: node scripts/package/package.mjs manifest --expect-version ${{ steps.version.outputs.version }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Loom-${{ steps.version.outputs.version }}-windows-x86_64
          path: |
            .packaging/dist/Loom-${{ steps.version.outputs.version }}-windows-x86_64-*
            .packaging/dist/update-windows-x86_64.json
          if-no-files-found: error

  publish:
    name: Upload to GitHub release draft
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          name: Loom-${{ needs.package.outputs.version }}-windows-x86_64
          path: dist

      # Draft creation and notes belong to the Prepare release draft workflow.
      - name: Upload packages to release draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.package.outputs.version }}
        run: >-
          node scripts/release/publish.mjs
          --version "$VERSION" --target "$GITHUB_SHA"
          --repo "$GITHUB_REPOSITORY" --assets dist
