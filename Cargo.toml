[package]
name = "loom"
autobins = false
version = "0.1.3"
edition = "2024"
description = "A minimal text editor built with lgui"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lius-new/loom"
readme = "README.md"

[workspace]
members = ["crates/editor-core", "crates/workspace-tests", "crates/markdown-tests"]
default-members = [".", "crates/editor-core"]
exclude = ["vendor/vt100"]
resolver = "3"

[patch.crates-io]
vt100 = { path = "vendor/vt100" }

[[bin]]
name = "Loom"
path = "src/main.rs"

[dependencies]
loom-editor-core = { path = "crates/editor-core" }
skia-safe = { version = "=0.99.0", default-features = false, features = ["binary-cache", "textlayout", "embed-icudtl"] }
pulldown-cmark = { version = "=0.13.5", default-features = false }
base64 = "0.22"
icondata = "0.7"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
notify = "8.2"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
vt100 = "0.16"
unicode-segmentation = "1.13"
unicode-width = "0.2"
regex = "1"
tree-sitter = { version = "0.27", features = ["wasm"] }
streaming-iterator = "0.1"
tree-sitter-language = "0.1"
libloading = "0.8"
ignore = "0.4"
globset = "0.4"
ureq = "2.12"
toml = "1.1"
tar = "0.4"
flate2 = "1.1"
fancy-regex = "0.19.2"

[dev-dependencies]
loom-editor-core = { path = "crates/editor-core", features = ["diagnostics"] }

[dependencies.lgui]
git = "https://github.com/lius-new/lgui.git"
rev = "0577517d10e761f97ebfc1e6ff426a2ddf5391d4"
default-features = false
features = ["renderer-skia-software", "widgets", "dialogs", "clipboard"]

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4"
conpty = "0.7"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(windows))'.dependencies]
libc = "0.2"
portable-pty = "0.9"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Memory"] }

[package.metadata.winresource]
ProductName = "Loom"
FileDescription = "Loom"
InternalName = "Loom"
OriginalFilename = "Loom.exe"

# Unoptimized layout and painting take ~35 ms per frame, which is longer than a
# key-repeat interval; typing into the terminal then queues and lags.
[profile.dev.package.lgui]
opt-level = 2
[profile.dev.package.lgui-assets]
opt-level = 2
[profile.dev.package.lgui-core]
opt-level = 2
[profile.dev.package.lgui-platform-winit]
opt-level = 2
[profile.dev.package.lgui-render-api]
opt-level = 2
[profile.dev.package.lgui-render-skia]
opt-level = 2
[profile.dev.package.lgui-services]
opt-level = 2
[profile.dev.package.lgui-widgets]
opt-level = 2
