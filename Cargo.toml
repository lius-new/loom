[package]
name = "loom"
autobins = false
version = "0.1.0"
edition = "2024"
description = "A minimal text editor built with lgui"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lius-new/loom"
readme = "README.md"

[[bin]]
name = "Loom"
path = "src/main.rs"

[dependencies]
icondata = "0.7"
image = { version = "0.25", default-features = false, features = ["png"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vt100 = "0.16"
unicode-segmentation = "1.13"
unicode-width = "0.2"

[dependencies.lgui]
git = "https://github.com/lius-new/lgui.git"
default-features = false
features = ["renderer-skia-software", "widgets", "dialogs", "clipboard"]

[target.'cfg(windows)'.dependencies]
conpty = "0.7"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(windows))'.dependencies]
portable-pty = "0.9"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package.metadata.winresource]
ProductName = "Loom"
FileDescription = "Loom"
InternalName = "Loom"
OriginalFilename = "Loom.exe"
