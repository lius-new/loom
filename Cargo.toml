[package]
name = "loom"
version = "0.1.0"
edition = "2024"
description = "A minimal text editor built with lgui"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lius-new/loom"
readme = "README.md"

[dependencies]
icondata = "0.7"
image = { version = "0.25", default-features = false, features = ["png"] }
vt100 = "0.16"

[dependencies.lgui]
path = "../lgui"
default-features = false
features = ["renderer-skia-software", "widgets", "dialogs"]

[target.'cfg(windows)'.dependencies]
conpty = "0.7"

[target.'cfg(not(windows))'.dependencies]
portable-pty = "0.9"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
