[package]
name = "loom"
autobins = false
version = "0.1.1"
edition = "2024"
description = "A minimal text editor built with lgui"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lius-new/loom"
readme = "README.md"

[workspace]
members = ["crates/editor-core", "crates/workspace-tests", "crates/language-packs/*"]
default-members = [".", "crates/editor-core", "crates/language-packs/*"]
exclude = ["vendor/vt100"]
resolver = "3"

[patch.crates-io]
vt100 = { path = "vendor/vt100" }

[[bin]]
name = "Loom"
path = "src/main.rs"

[dependencies]
loom-editor-core = { path = "crates/editor-core" }
base64 = "0.22"
icondata = "0.7"
image = { version = "0.25", default-features = false, features = ["png"] }
notify = "8.2"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
vt100 = "0.16"
unicode-segmentation = "1.13"
unicode-width = "0.2"
regex = "1"
tree-sitter = "0.27"
streaming-iterator = "0.1"
tree-sitter-language = "0.1"
libloading = "0.8"
ignore = "0.4"
globset = "0.4"
ureq = "2.12"

[build-dependencies]
serde_json = "1"

[dev-dependencies]
loom-grammar-json = { path = "crates/language-packs/json" }
loom-grammar-markdown = { path = "crates/language-packs/markdown" }
loom-editor-core = { path = "crates/editor-core", features = ["diagnostics"] }
loom-grammar-rust = { path = "crates/language-packs/rust" }
loom-grammar-javascript = { path = "crates/language-packs/javascript" }
loom-grammar-typescript = { path = "crates/language-packs/typescript" }
loom-grammar-csharp = { path = "crates/language-packs/csharp" }
loom-grammar-css = { path = "crates/language-packs/css" }
loom-grammar-html = { path = "crates/language-packs/html" }

[dependencies.lgui]
git = "https://github.com/lius-new/lgui.git"
rev = "6fc706e4947103d5456490ea5ec9b2cb15d94fc6"
default-features = false
features = ["renderer-skia-software", "widgets", "dialogs", "clipboard"]

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4"
conpty = "0.7"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(windows))'.dependencies]
libc = "0.2"
portable-pty = "0.9"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Memory"] }

[package.metadata.winresource]
ProductName = "Loom"
FileDescription = "Loom"
InternalName = "Loom"
OriginalFilename = "Loom.exe"
