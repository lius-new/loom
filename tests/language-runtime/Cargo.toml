[package]
name = "loom-language-runtime-tests"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
loom-editor-core = { path = "../../crates/editor-core", features = ["diagnostics"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tree-sitter = "0.27"
tree-sitter-language = "0.1"
streaming-iterator = "0.1"
libloading = "0.8"
ring = "0.17"

[[bin]]
name = "language-runtime-probe"
path = "src/main.rs"
test = false
