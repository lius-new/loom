[servers.bash-language-server]
name = "Bash Language Server"
pack = "bash-language-server"
command = "${runtime.node}/node"
args = [ "${pack}/node_modules/bash-language-server/out/cli.js", "start" ]

[servers.bash-language-server.root]
markers = [ ".git" ]
strategy = "nearest"
fallback = "workspace"

[[servers.bash-language-server.languages]]
language = "bash"
language_id = "shellscript"

[servers.biome]
name = "Biome"
pack = "biome"
command = "${pack}/biome"
args = [ "lsp-proxy" ]

[servers.biome.root]
markers = [ "biome.json", "biome.jsonc" ]
strategy = "nearest"
fallback = "workspace"

[[servers.biome.languages]]
language = "javascript"
language_id = "javascript"

[[servers.biome.languages]]
language = "typescript"
variant = "typescript"
language_id = "typescript"

[[servers.biome.languages]]
language = "typescript"
variant = "tsx"
language_id = "typescriptreact"

[[servers.biome.languages]]
language = "json"
language_id = "json"

[[servers.biome.languages]]
language = "css"
language_id = "css"

[servers.clangd]
name = "clangd"
pack = "clangd"
command = "${pack}/bin/clangd"

[servers.clangd.root]
markers = [ "compile_commands.json", "compile_flags.txt", ".clangd" ]
strategy = "nearest"
fallback = "workspace"

[[servers.clangd.languages]]
language = "c"
language_id = "c"

[[servers.clangd.languages]]
language = "cpp"
language_id = "cpp"

[[servers.clangd.languages]]
language = "objc"
language_id = "objective-c"

[servers.gopls]
name = "gopls"
pack = "gopls"
command = "${pack}/gopls"

[servers.gopls.root]
markers = [ "go.work", "go.mod" ]
strategy = "nearest"
fallback = "workspace"

[[servers.gopls.languages]]
language = "go"
language_id = "go"

[servers.lua-language-server]
name = "Lua Language Server"
pack = "lua-language-server"
command = "${pack}/bin/lua-language-server"

[servers.lua-language-server.root]
markers = [ ".luarc.json", ".luarc.jsonc" ]
strategy = "nearest"
fallback = "workspace"

[[servers.lua-language-server.languages]]
language = "lua"
language_id = "lua"

[servers.marksman]
name = "Marksman"
pack = "marksman"
command = "${pack}/marksman"
args = [ "server" ]

[servers.marksman.root]
markers = [ ".marksman.toml", ".git" ]
strategy = "nearest"
fallback = "workspace"

[[servers.marksman.languages]]
language = "markdown"
language_id = "markdown"

[servers.pyright]
name = "Pyright"
pack = "pyright"
command = "${runtime.node}/node"
args = [ "${pack}/node_modules/pyright/langserver.index.js", "--stdio" ]
priority = 10

[servers.pyright.root]
markers = [ "pyrightconfig.json", "pyproject.toml", "setup.py", "setup.cfg", "requirements.txt" ]
strategy = "nearest"
fallback = "workspace"

[[servers.pyright.languages]]
language = "python"
language_id = "python"

[servers.ruff]
name = "Ruff"
pack = "ruff"
command = "${pack}/ruff"
args = [ "server" ]

[servers.ruff.root]
markers = [ "ruff.toml", ".ruff.toml", "pyproject.toml" ]
strategy = "nearest"
fallback = "workspace"

[[servers.ruff.languages]]
language = "python"
language_id = "python"

[servers.rust-analyzer]
name = "rust-analyzer"
pack = "rust-analyzer"
command = "${pack}/rust-analyzer"

[servers.rust-analyzer.root]
markers = [ "Cargo.toml", "rust-project.json" ]
strategy = "outermost"
fallback = "file_directory"

[[servers.rust-analyzer.languages]]
language = "rust"
language_id = "rust"

[servers.taplo]
name = "Taplo"
pack = "taplo"
command = "${pack}/taplo"
args = [ "lsp", "stdio" ]

[servers.taplo.root]
markers = [ ".taplo.toml", "taplo.toml" ]
strategy = "nearest"
fallback = "workspace"

[[servers.taplo.languages]]
language = "toml"
language_id = "toml"

[servers.typescript-language-server]
name = "TypeScript Language Server"
pack = "typescript-language-server"
command = "${runtime.node}/node"
args = [ "${pack}/node_modules/typescript-language-server/lib/cli.mjs", "--stdio" ]
priority = 10

[servers.typescript-language-server.initialization_options.tsserver]
path = "${pack}/node_modules/typescript/lib/tsserver.js"

[servers.typescript-language-server.root]
markers = [ "tsconfig.json", "jsconfig.json", "package.json" ]
strategy = "nearest"
fallback = "workspace"

[[servers.typescript-language-server.languages]]
language = "javascript"
language_id = "javascript"

[[servers.typescript-language-server.languages]]
language = "typescript"
variant = "typescript"
language_id = "typescript"

[[servers.typescript-language-server.languages]]
language = "typescript"
variant = "tsx"
language_id = "typescriptreact"

[servers.vscode-css-language-server]
name = "CSS Language Server"
pack = "vscode-langservers-extracted"
command = "${runtime.node}/node"
args = [ "${pack}/node_modules/vscode-langservers-extracted/bin/vscode-css-language-server", "--stdio" ]

[servers.vscode-css-language-server.root]
markers = [ "package.json" ]
strategy = "nearest"
fallback = "workspace"

[[servers.vscode-css-language-server.languages]]
language = "css"
language_id = "css"

[[servers.vscode-css-language-server.languages]]
language = "scss"
language_id = "scss"

[servers.vscode-eslint-language-server]
name = "ESLint Language Server"
pack = "vscode-langservers-extracted"
command = "${runtime.node}/node"
args = [ "${pack}/node_modules/vscode-langservers-extracted/bin/vscode-eslint-language-server", "--stdio" ]
priority = -10

[servers.vscode-eslint-language-server.root]
markers = [ "eslint.config.js", "eslint.config.mjs", "eslint.config.cjs", ".eslintrc.json", ".eslintrc.js" ]
strategy = "nearest"
fallback = "workspace"

[[servers.vscode-eslint-language-server.languages]]
language = "javascript"
language_id = "javascript"

[[servers.vscode-eslint-language-server.languages]]
language = "typescript"
variant = "typescript"
language_id = "typescript"

[[servers.vscode-eslint-language-server.languages]]
language = "typescript"
variant = "tsx"
language_id = "typescriptreact"

[servers.vscode-html-language-server]
name = "HTML Language Server"
pack = "vscode-langservers-extracted"
command = "${runtime.node}/node"
args = [ "${pack}/node_modules/vscode-langservers-extracted/bin/vscode-html-language-server", "--stdio" ]

[servers.vscode-html-language-server.root]
markers = [ "package.json" ]
strategy = "nearest"
fallback = "workspace"

[[servers.vscode-html-language-server.languages]]
language = "html"
language_id = "html"

[servers.vscode-json-language-server]
name = "JSON Language Server"
pack = "vscode-langservers-extracted"
command = "${runtime.node}/node"
args = [ "${pack}/node_modules/vscode-langservers-extracted/bin/vscode-json-language-server", "--stdio" ]

[servers.vscode-json-language-server.root]
markers = [ "package.json" ]
strategy = "nearest"
fallback = "workspace"

[[servers.vscode-json-language-server.languages]]
language = "json"
language_id = "json"

[servers.yaml-language-server]
name = "YAML Language Server"
pack = "yaml-language-server"
command = "${runtime.node}/node"
args = [ "${pack}/node_modules/yaml-language-server/bin/yaml-language-server", "--stdio" ]

[servers.yaml-language-server.root]
markers = [ ".git" ]
strategy = "nearest"
fallback = "workspace"

[[servers.yaml-language-server.languages]]
language = "yaml"
language_id = "yaml"

[servers.zls]
name = "zls"
pack = "zls"
command = "${pack}/zls"

[servers.zls.root]
markers = [ "build.zig", "build.zig.zon" ]
strategy = "nearest"
fallback = "file_directory"

[[servers.zls.languages]]
language = "zig"
language_id = "zig"
