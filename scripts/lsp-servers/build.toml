# Language server recipes.
#
# This is the only place Loom's language servers are defined. A pack is an
# installable archive set; a server is a way of starting something a pack
# contains. The published catalog (assets/lsp-servers/lsp-servers.toml) is
# generated from these recipes and their pins; it is never edited by hand.
#
# Pinned hashes live in pins.toml (written by pin.mjs), npm lockfiles in npm/<pack>.
# Nothing here is a floating version: every archive is pinned by tag and SHA-256,
# every npm dependency by lockfile integrity, every Go module by its sum.
#
# Pack kinds
#   archive  upstream archives per platform (zip, tar.gz, tar.xz, gz or one raw file)
#   npm      a Node server and its locked dependencies, built once for every platform
#   go       a Go module built from source for each platform
#
# Server commands may start with ${pack} (the pack's own files) or ${runtime.<id>}
# (a pack the pack requires). On Windows the loader appends .exe to a command that
# names an executable without an extension.
schema = 1

# ---------------------------------------------------------------- runtime

[packs.node]
kind = "archive"
version = "22.23.3"
license = "MIT"
upstream = { source = "nodejs" }

[packs.node.platforms.windows-x86_64]
asset = "node-v22.23.3-win-x64.zip"
format = "zip"
executables = ["node.exe"]
include = ["node.exe", "LICENSE"]

[packs.node.platforms.windows-aarch64]
asset = "node-v22.23.3-win-arm64.zip"
format = "zip"
executables = ["node.exe"]
include = ["node.exe", "LICENSE"]

[packs.node.platforms.macos-x86_64]
asset = "node-v22.23.3-darwin-x64.tar.gz"
format = "tar.gz"
executables = ["node"]
include = [{ from = "bin/node", to = "node" }, "LICENSE"]

[packs.node.platforms.macos-aarch64]
asset = "node-v22.23.3-darwin-arm64.tar.gz"
format = "tar.gz"
executables = ["node"]
include = [{ from = "bin/node", to = "node" }, "LICENSE"]

[packs.node.platforms.linux-x86_64]
asset = "node-v22.23.3-linux-x64.tar.xz"
format = "tar.xz"
executables = ["node"]
include = [{ from = "bin/node", to = "node" }, "LICENSE"]

[packs.node.platforms.linux-aarch64]
asset = "node-v22.23.3-linux-arm64.tar.xz"
format = "tar.xz"
executables = ["node"]
include = [{ from = "bin/node", to = "node" }, "LICENSE"]

